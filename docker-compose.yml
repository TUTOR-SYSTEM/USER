version: '3.8'

services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "4002:4002"
    env_file:
      - docker.env
    environment:
      - NODE_ENV=development
      - PORT=4002
    depends_on:
      - postgres
      - rabbitmq
      - redis
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: backends-postgres
    environment:
      - POSTGRES_DB=user_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: backends-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: backends-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  backend:
    driver: bridge
