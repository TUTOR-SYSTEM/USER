version: '3.8'

services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set from the shell before building, e.g. USER_GIT_COMMIT=$(git rev-parse --short HEAD)
        GIT_COMMIT: ${USER_GIT_COMMIT:-unknown}
    container_name: user-service
    ports:
      - "127.0.0.1:4001:4001"
    env_file:
      - docker.env
    environment:
      - NODE_ENV=development
      - PORT=4001
    depends_on:
      - postgres
      - rabbitmq
      - redis
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: backends-postgres
    environment:
      - POSTGRES_DB=8f78b51c031c426fa58b47f875fec202
      - POSTGRES_USER=af56f868db2a46029d4d210a342ac046
      - POSTGRES_PASSWORD=f5216f5d-1435-4487-898b-f0b1edd70c02
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: backends-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: backends-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  backend:
    driver: bridge
